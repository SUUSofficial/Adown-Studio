<html lang="zh - CN">
<head>
<meta charset="UTF - 8">
<meta name="viewport" content="width=device-width, initial - scale=1.0">
<title>Adown Community</title>
<style>
/* 全局样式 */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: Arial, sans-serif;
}
/* 顶部导航栏样式 */
.top-nav {
background-color: #7c4dff;
color: white;
padding: 15px;
display: flex;
justify-content: space-between;
align-items: center;
}
.logo {
display: flex;
align-items: center;
}
.logo-img {
width: 50px;
height: 50px;
margin-right: 10px;
}
.search-bar {
height: 40px;
width: 400px;
border: none;
border-radius: 20px;
padding: 0 15px;
display: flex;
align-items: center;
}
.search-input {
flex: 1;
border: none;
outline: none;
}
.search-icon {
margin-right: 10px;
}
.bell-icon {
width: 20px;
height: 20px;
}
.user-icon {
width: 30px;
height: 30px;
border-radius: 50%;
}
/* 侧边栏样式 */
.sidebar {
background-color: #f9f9f9;
width: 200px;
padding: 20px;
position: fixed;
height: 100%;
overflow: auto;
}
.user-profile {
display: flex;
align-items: center;
margin-bottom: 20px;
}
.user-avatar {
width: 50px;
height: 50px;
border-radius: 50%;
margin-right: 10px;
}
.user-name {
font-size: 14px;
}
.user-level {
font-size: 12px;
color: #999;
}
.entry-button {
background-color: #7c4dff;
color: white;
border: none;
padding: 8px 15px;
border-radius: 5px;
margin-bottom: 10px;
}
.sidebar-list {
list-style: none;
}
.sidebar-list li {
padding: 5px 0;
font-size: 14px;
}
.sidebar-list li a {
text-decoration: none;
color: #333;
}
/* 主内容区样式 */
.main-content {
margin-left: 220px;
padding: 20px;
}
.content-section {
display: flex;
flex-wrap: wrap;
justify-content: space-between;
}
.section-title {
width: 100%;
font-size: 16px;
margin-bottom: 10px;
}
.content-item {
width: 30%;
margin-bottom: 20px;
background-color: #f9f9f9;
padding: 10px;
text-align: center;
}
.content-img {
width: 100%;
height: auto;
margin-bottom: 10px;
}
.content-desc {
font-size: 12px;
color: #666;
}
/* 右侧栏样式 */
.right-sidebar {
background-color: #f9f9f9;
width: 200px;
padding: 20px;
position: fixed;
right: 0;
top: 0;
height: 100%;
overflow: auto;
}
.update-title {
font-size: 16px;
margin-bottom: 10px;
}
.update-item {
margin-bottom: 15px;
background-color: white;
padding: 10px;
border-radius: 5px;
}
.update-img {
width: 100%;
height: auto;
margin-bottom: 10px;
}
.update-desc {
font-size: 12px;
color: #666;
}
</style>
</head>
